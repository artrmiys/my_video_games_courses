site_name: Diseño de Videojuegos — Da Vinci
site_description: "Записи курсов геймдизайна Escuela Da Vinci: одно видео на предмет, русская озвучка поверх оригинала"
site_url: https://artrmiys.github.io/my_video_games_courses/
repo_url: https://github.com/artrmiys/my_video_games_courses
repo_name: my_video_games_courses
docs_dir: content
site_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/images/brand/icon-kb-128.png
  favicon: assets/images/brand/icon-kb-128.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Включить тёмный режим
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Включить светлый режим
  font: false
extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/js/zoom.js

nav:
  - Главная: index.md

plugins:
  - search:
      lang:
        - es
        - ru

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
